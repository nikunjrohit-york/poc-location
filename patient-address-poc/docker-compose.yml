services:
  postgres:
    image: postgres:15
    pull_policy: if_not_present
    container_name: patient-address-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patient_address
    ports:
      - "5433:5432"
    volumes:
      - patient_address_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patient_address"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  patient_address_pg:
